; ============================================================
; PlatformIO – ESP32WoMo
; Board: Sunton ESP32-S3 4.3" 800x480
; ============================================================
[platformio]
default_envs = esp32-8048S043C
boards_dir   = boards

[env]
platform  = espressif32
framework = arduino
monitor_speed   = 115200
monitor_rts     = 0
monitor_dtr     = 0
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER
    -I include
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ayushsharma82/ElegantOTA.git
    bblanchon/ArduinoJson @ ^7

[env:esp32-8048S043C]
board = esp32-8048S043C
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -Ofast
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D LV_CONF_INCLUDE_SIMPLE

build_src_filter = 
    +<*>
    -<main-s2.cpp>

lib_deps =
    ${env.lib_deps}
    https://github.com/rzeldent/esp32-smartdisplay.git

[env:lolin_s2_mini]
board = lolin_s2_mini
upload_port = /dev/ttyACM0

build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0
    -D NO_DISPLAY
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui_main.cpp>
    -<ui_sensoren.cpp>
    -<ui_details.cpp>
    -<ui_charger.cpp>
    -<ui_wled.cpp>
    -<wled.cpp>
    -<sdcard.cpp>    
    -<tardisSmall.c>
    -<earthSmall.c>

